

Here’s a small, standalone login page you can save as `login.html`. It displays a form but **does not authenticate users**—you’ll need a backend to verify credentials securely.

```html name=login.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 320px;
      margin: 80px auto;
      padding: 20px;
    }

    input, button {
      box-sizing: border-box;
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 10px;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Login</h1>

  <form action="/login" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>

    <button type="submit">Log in</button>
  </form>
</body>
</html>
```
